<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><meta name="description" content="متابع مذاكرة CVS لسكشن A2 مع حفظ تلقائي للتقدم">
<title>CVS Study Hub | Section A2</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand-mark">CVS</div>
    <div class="brand-copy"><div class="brand-title">Study Hub</div><div class="brand-sub">SECTION A2 · 2026/2027</div></div>
    <div class="header-actions"><span id="saveStatus" class="save-status">● محفوظ</span><button id="themeBtn" class="icon-btn" title="تغيير المظهر" aria-label="تغيير المظهر">◐</button></div>
  </header>
  <section class="welcome-strip">
    <div><div class="eyebrow">CARDIOVASCULAR SYSTEM</div><h1>خطة مذاكرة الـ CVS</h1><p>تابع محاضراتك، سكاشنك، ومراجعاتك من مكان واحد.</p></div>
    <div class="hero-orbit"><span>♥</span></div>
  </section>
  <nav class="tabs" id="tabs" aria-label="أقسام التطبيق">
    <button class="tab active" data-tab="overview"><span>⌂</span>نظرة عامة</button>
    <button class="tab" data-tab="lectures"><span>▤</span>المحاضرات</button>
    <button class="tab" data-tab="practicals"><span>✚</span>العملي A2</button>
    <button class="tab" data-tab="revision"><span>↻</span>المراجعة</button>
    <button class="tab" data-tab="mistakes"><span>✎</span>نقاط الضعف</button>
    <button class="tab" data-tab="final"><span>✓</span>قبل الامتحان</button>
    <button class="tab" data-tab="backup"><span>⚙</span>البيانات</button>
  </nav>
  <main id="main" class="main-content"></main>
  <footer class="app-footer"><span>Built around your faculty timetable</span><span>Auto-save on this device</span></footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<script src="data.js"></script><script src="app.js"></script>
</body></html>
